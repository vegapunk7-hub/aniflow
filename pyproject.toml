[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aniflow"
version = "1.0.0"
description = "Advanced multi-source anime batch downloader with intelligent parallel processing and streaming"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "vegapunk7-hub", email = ""}
]
keywords = ["anime", "downloader", "streaming", "cli", "batch", "multi-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

dependencies = [
    "aiohttp>=3.9.0",
    "asyncio-contextmanager>=1.0.0",
    "pycryptodomex>=3.19.0",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "tomli-w>=1.0.0",
    "httpx>=0.25.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "schedule>=1.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "black>=23.12.0",
    "isort>=5.13.0",
    "pre-commit>=3.5.0",
]

[project.urls]
Homepage = "https://github.com/vegapunk7-hub/aniflow"
Repository = "https://github.com/vegapunk7-hub/aniflow.git"
Issues = "https://github.com/vegapunk7-hub/aniflow/issues"
Documentation = "https://github.com/vegapunk7-hub/aniflow/wiki"

[project.scripts]
aniflow = "aniflow.main:cli"

[tool.setuptools]
packages = ["aniflow"]

[tool.setuptools.package-data]
aniflow = ["py.typed"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "C4", "RUF", "PIE"]
ignore = ["E501", "W503"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-v --cov=aniflow --cov-report=term-missing --asyncio-mode=auto"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "requires_network: Tests requiring network access",
]

[tool.coverage.run]
source = ["aniflow"]
omit = [
    "*/tests/*",
    "*/site-packages/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
